name: auto_Sign

on:
  schedule:
    - cron: "30 23 * * *"  # 每天 UTC 23:30 触发（北京/台北时间次日 07:30）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pycryptodome requests

      - name: Run auto sign script
        env:
          # 这两个从仓库 Settings → Secrets and variables → Actions 里设置
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          # 可选：支持多账号时用换行或逗号分隔
          # USERNAME_LIST: ${{ secrets.USERNAME_LIST }}
          # PASSWORD_LIST: ${{ secrets.PASSWORD_LIST }}
        run: |
          python auto_sign.py
