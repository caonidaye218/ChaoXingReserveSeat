name: auto_Sign

on:
  schedule:
    # 第一个签到窗口：9:40-10:00 (预约时段10:00-14:00)
    - cron: '40 1 * * *'  # 北京时间9:40
    
    # 第二个签到窗口：13:40-14:00 (预约时段14:00-18:00)  
    - cron: '40 5 * * *'  # 北京时间13:40
    
    # 第三个签到窗口：17:40-18:00 (预约时段18:00-22:00)
    - cron: '40 9 * * *'  # 北京时间17:40
    
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get install build-essential libssl-dev libffi-dev python3-dev -y
          pip install pycryptodome requests

      - name: run auto sign script
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          python auto_sign.py
