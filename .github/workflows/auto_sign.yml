name: auto_sign

on:
  schedule:
    - cron: "40 23 * * *"  # 每天UTC时间23:30启动（北京时间7:30）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 设置时区为中国标准时间
    env:
      TZ: Asia/Shanghai
      
    steps:
      - uses: actions/checkout@v3  # 更新到v3版本

      - name: Set up Python 3.11
        uses: actions/setup-python@v4  # 更新到v4版本
        with:
          python-version: '3.11'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install build-essential libssl-dev libffi-dev python3-dev -y
          pip install pycryptodome requests

      - name: run auto sign script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          echo "开始执行自动签到..."
          echo "当前时间: $(date)"
          echo "时区: $TZ"
          python auto_sign.py
