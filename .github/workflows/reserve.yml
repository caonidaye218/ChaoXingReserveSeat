# This is a basic workflow that is manually triggered

name: auto_Reserve

on:
  schedule:
    - cron: "0 13 * * *"  # 每天21:00（Asia/Shanghai时间）对应UTC 13:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get install build-essential libssl-dev libffi-dev python3-dev -y
          pip install cryptography requests opencv-python

      - name: Wait until 17:30 (Asia/Shanghai)
        run: |
          export TZ="Asia/Shanghai"
          current_time=$(date +%s)
          target_time=$(date -d "today 17:30" +%s)
          if [ $current_time -ge $target_time ]; then
              target_time=$(date -d "tomorrow 17:30" +%s)
          fi
          wait_seconds=$((target_time - current_time))
          echo "Waiting for $wait_seconds seconds until 17:30 local time..."
          sleep $wait_seconds

      - name: Run script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          python main.py -m debug --action

