name: Auto Reserve

# 定时 + 手动 都能触发
on:
  # 每天 14:00 UTC（= 北京 22:00）自动触发
  schedule:
    - cron: '0 14 * * *'
  # 也可以手动点击 Run workflow
  workflow_dispatch:

jobs:
  reserve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reserve seats
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          python main.py -u config.json -m reserve -a
